name: Metrics

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 06:00 UTC (03:00 BRT)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar SVG de métricas
        uses: lowlighter/metrics@latest
        with:
          # Personal Access Token (classic) com escopo `repo`.
          # Crie em Settings > Developer settings > Tokens (classic) e
          # adicione como secret do repositório com o nome METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}
          user: Whiskyrie

          # Commita o SVG no branch dedicado `metrics` (não polui a main).
          filename: github-metrics.svg
          output_action: commit
          committer_branch: metrics
          config_timezone: America/Sao_Paulo

          # Conteúdo do card
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
